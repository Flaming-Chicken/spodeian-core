name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown,aarch64-linux-android,aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Nextest
        uses: taiki-e/install-action@nextest

      - name: Run Test Suite with Nextest
        run: cargo nextest run --workspace --all-targets --exclude sml-py-bridge --profile ci

      - name: Check WebAssembly Compilation
        # sml-py-bridge links CPython through PyO3 and cannot target wasm32.
        run: cargo check --workspace --exclude sml-py-bridge --target wasm32-unknown-unknown

      - name: Install wasm-bindgen Test Runner (version from Cargo.lock)
        run: |
          WB_VERSION=$(cargo pkgid --quiet wasm-bindgen | sed 's/.*[@#]//')
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked

      - name: Run WebAssembly Browser Tests (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test --target wasm32-unknown-unknown --lib --tests -p spodeian-cache -p spodeian-telemetry -p spodeian-web-utils

      # tokenizers (via candle) builds oniguruma from C, so the Android check
      # needs the NDK's clang; cargo-ndk points cc-rs at it.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check Android Compilation
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          fi
          cargo ndk -t arm64-v8a check --workspace

  semver-checks:
    name: Semver Stability Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Verify Semver Guarantees for Stable Crates
        # Compared against main: spodeian crates are not published on crates.io.
        run: |
          status=0
          for crate in spodeian-cache spodeian-export spodeian-telemetry spodeian-tokens spodeian-ui spodeian-web-utils; do
            cargo semver-checks check-release -p "$crate" --baseline-rev origin/main || status=1
          done
          exit $status

  python:
    name: Python (uv + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The tests import the compiled spodeian_py_bridge (crates/sml-py-bridge).
      - name: Build the Rust bridge
        run: uv run python scripts/build_bridge.py

      - name: Run Test Suite
        run: uv run pytest
