[package]
name = "spodeian-telemetry"
version = "1.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal, zero-overhead tracing and panic telemetry initializer across native and WASM runtimes"
repository.workspace = true
readme = "README.md"

[features]
default = []
release_max_level_info = ["tracing/release_max_level_info"]
release_max_level_warn = ["tracing/release_max_level_warn"]

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber = { workspace = true }
tracing-web = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
