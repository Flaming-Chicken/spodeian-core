[package]
name = "spodeian-py-bridge"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop-only PyO3 FFI bridge exposing Spodeian Rust data augmentations, ODE solvers, and factors to Python"

[lib]
name = "spodeian_py_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
spodeian-lake = { workspace = true }
spodeian-export = { workspace = true }
spodeian-ml-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pyo3 = { workspace = true }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
