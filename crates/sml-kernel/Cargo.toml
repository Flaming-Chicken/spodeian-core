[package]
name = "sml-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hardware compute kernel track: WebGPU (WGSL) shaders & CPU SIMD kernels with CPU fallback"

[dependencies]
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
candle-core = { workspace = true }
ai-kernel = { package = "sml-kernel", path = "." }

# The kernels/ track mirrors the WGSL and CUDA originals: explicit index loops,
# spelled-out index terms such as `0 * stride`, full-precision constants, and
# the kernels' original argument lists. These lints fight that style, so
# they're allowed here; every other clippy lint stays on.
[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
excessive_precision = "allow"
identity_op = "allow"
erasing_op = "allow"
eq_op = "allow"
same_item_push = "allow"
type_complexity = "allow"
manual_memcpy = "allow"
