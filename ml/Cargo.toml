[workspace]
members = [
    "crates/ai-architect-schema",
    "crates/ai-candle",
    "crates/ai-kernel",
    "crates/aix",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AI-Examples Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = "0.8.2"
candle-nn = "0.8.2"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
strip = true

