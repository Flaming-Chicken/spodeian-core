[workspace]
resolver = "3"
members = [
    "crates/sml-candle",
    "crates/sml-kernel",
    "crates/sml-lake",
    "crates/sml-py-bridge",
    "crates/sml-runtime",
    "crates/sml-schema",
    "crates/sml-tools",
]
default-members = [
    "crates/sml-candle",
    "crates/sml-kernel",
    "crates/sml-lake",
    "crates/sml-runtime",
    "crates/sml-schema",
    "crates/sml-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
authors = ["Spodeian ML Contributors"]

[workspace.dependencies]
sml-candle = { path = "crates/sml-candle", version = "0.1.0" }
sml-kernel = { path = "crates/sml-kernel", version = "0.1.0" }
sml-lake = { path = "crates/sml-lake", version = "0.1.0" }
sml-py-bridge = { path = "crates/sml-py-bridge", version = "0.1.0" }
sml-runtime = { path = "crates/sml-runtime", version = "0.1.0" }
sml-schema = { path = "crates/sml-schema", version = "0.1.0" }
sml-tools = { path = "crates/sml-tools", version = "0.1.0" }

# Foundation Crates from spodeian-core
spodeian-cache = { path = "../spodeian-core/crates/spodeian-cache", version = "^1.0.0" }
spodeian-export = { path = "../spodeian-core/crates/spodeian-export", version = "^1.0.0" }
spodeian-telemetry = { path = "../spodeian-core/crates/spodeian-telemetry", version = "^1.0.0" }

# Machine Learning & Tensors
candle-core = "0.11"
candle-nn = "0.11"
safetensors = "0.5"

# Columnar Parquet & Arrow
parquet = { version = "53", default-features = false, features = ["arrow", "flate2"] }
arrow-schema = "53"
arrow-array = "53"
bytes = "1.10"

# Python FFI Bridge
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

# Serialization & System
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
base64 = "0.22"
rayon = "1.10"
tracing = "0.1"
smallvec = "1.16"
byteorder = "1.5"
ahash = "0.8"

# WebGPU & Hardware Compute
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
strip = true
