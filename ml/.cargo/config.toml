# Cargo configuration for AI-Examples workspace

[build]
# Disable rustc-wrapper to prevent socket permission errors with sccache in sandboxed environments
rustc-wrapper = ""

[target.x86_64-pc-windows-msvc]
# Use rust-lld for fast linking on Windows
linker = "rust-lld"

[alias]
aix = "run --release -p aix --"

